<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exquilo · Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_style.css') }}">
</head>

<body class="login-page">
    <div class="login-card">
        <div class="lock-icon"><i class="fas fa-lock"></i></div>
        <h1 class="login-title">Acesso Restrito</h1>
        <p class="login-subtitle">Digite a senha administrativa</p>

        {% if error %}
        <div class="error-msg"><i class="fas fa-exclamation-triangle"></i> Senha incorreta. Tente novamente.</div>
        {% endif %}

        <form method="post" action="{{ url_for('admin.login') }}">
            <div class="input-field">
                <label><i class="fas fa-key"></i> Senha</label>
                <input type="password" name="password" placeholder="********" autofocus required>
            </div>
            <button type="submit" class="login-button"><i class="fas fa-sign-in-alt"></i> Entrar</button>
        </form>
        <footer class="login-footer"><i class="fas fa-shield-alt"></i> Ambiente seguro</footer>
    </div>
</body>

</html>
